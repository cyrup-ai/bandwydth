[package]
name = "bandwydth_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace dependencies
tokio = { version = "1.46.1", features = ["full"] }
tracing = "0.1.41"
serde = "1.0.219"
bincode = { version = "2.0.1", features = ["derive"] }

# QUIC transport
cryypt_quic = { path = "../../cryypt/quic" }

# Local dependencies
lib_bandwydth = { path = ".." }
rcgen = "0.14.2"
cryypt = { version = "0.1.0", path = "../../cryypt/cryypt" }
serde_json = "1.0"
futures-util = "0.3"

[dev-dependencies]
tracing-subscriber = "0.3"
