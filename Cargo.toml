[package]
name = "lib_bandwydth"
version = "0.1.0"
edition = "2021"
authors = ["David Maple<david@cyrup.ai>"]
license = "MIT OR Apache-2.0"
description = "Network bandwidth monitoring for progresshub"

[dependencies]
chrono = "0.4"
clap-verbosity-flag = "3.0.3"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
derive_more = { version = "2.0.1", features = ["debug"] }
eyre = "0.6"
itertools = "0.14"
log = "0.4"
once_cell = "1.21"
pnet = "0.35"
pnet_macros_support = "0.35"
ratatui = "0.30.0-alpha.5"
resolv-conf = "0.7"
simplelog = "0.12"
thiserror = "2.0"
tokio = { version = "1.45", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "signal"] }
tokio-stream = "0.1"
futures = "0.3"
hickory-resolver = { version = "0.25.2", features = ["tokio"] }
hickory-proto = "0.25.2"
unicode-width = "0.2.0"
strum = { version = "0.27", features = ["derive"] }
sysinfo = "0.36.1"
crossbeam-channel = "0.5"

libc = "0.2"
tachyonfx = { git = "https://github.com/cyrup-ai/tachyonfx", branch = "main", features = ["sendable"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
crossbeam-queue = "0.3.12"
crossbeam = "0.8.4"
pin-project-lite = "0.2.16"
futures-timer = "3.0.3"
octocrab = "0.44.1"
serde = { version = "1.0.219", features = ["derive"] }
tokio-util = "0.7"
color-eyre = "0.6"
# Direct QUIC dependencies for ProgressHub client
cryypt_quic = { git = "https://github.com/cyrup-ai/cryypt", branch = "main", package = "cryypt_quic" }
cryypt = { git = "https://github.com/cyrup-ai/cryypt", branch = "main", features = ["key", "quic", "aes", "sha256", "zstd", "pqcrypto", "vault"] }
# hickory-resolver already specified above


[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
procfs = "0.17"
nix = { version = "0.30", features = ["user"] }

[target.'cfg(any(target_os = "macos", target_os = "freebsd"))'.dependencies]
regex = "1.11"
nix = { version = "0.30", features = ["user"] }

[target.'cfg(target_os = "windows")'.dependencies]
netstat2 = "0.11"
sysinfo = "0.36.1"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell"
] }

[dev-dependencies]
insta = "1.43.1"
packet-builder = { version = "0.7.0", git = "https://github.com/cyqsimon/packet_builder.git", branch = "patch-pnet-0.35" }
pnet_base = "0.35.0"
regex = "1.11.1"
rstest = "0.24.0"

[build-dependencies]
clap = { version = "4.5.40", features = ["derive"] }
clap-verbosity-flag = "3.0.3"
clap_complete = "4.5.54"
clap_mangen = "0.2.27"
derive_more = { version = "2.0.1", features = ["debug"] }
eyre = "0.6.12"
strum = { version = "0.27.1", features = ["derive"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
http_req = "0.14.0"
zip = { version = "4.1.0", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate", "time", "zstd"] }

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"
panic = "abort"
strip = "symbols"

[lib]
name = "lib_bandwydth"
path = "src/lib.rs"

[[bin]]
name = "bandwydth"
path  = "src/main.rs"

