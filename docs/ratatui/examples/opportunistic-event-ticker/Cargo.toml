[package]
name = "opportunistic_event_ticker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ratatui = "0.30.0-alpha.5"
crossterm = { version = "0.29", features = ["event-stream", "serde"] }
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "fs", "time", "signal", "sync"] }
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
crossbeam = "0.8"
color-eyre = "0.6.5"
octocrab = "0.44.1"
futures-timer = "3.0.3"
pin-project-lite = "0.2"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }
signal-hook = "0.3"
unicode-width = "0.2.0"

# No build dependencies needed

[features]
default = ["dots", "line", "arc", "bouncing_bar", "circle_quarters", "toggle"]

